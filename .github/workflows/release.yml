name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run version -- ${{ github.ref_name }}
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Test Windows background process behavior
        if: matrix.platform == 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml claude_plugin::tests

      - name: Read release notes from tag annotation
        shell: bash
        run: |
          git fetch --tags --force --quiet
          {
            echo "RELEASE_BODY<<__EOF__"
            git tag -l --format='%(contents)' "${{ github.ref_name }}"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      # releaseDraft: matrix jobs publish into a DRAFT release so
      # releases/latest keeps serving the previous version until the publish
      # job flips it — checking for updates mid-build can no longer hit a
      # half-uploaded latest.json. releaseAssetNamePattern makes all files
      # agent-hub_*; the updater manifest URLs follow automatically.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Agent Hub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          releaseAssetNamePattern: "agent-hub_[version]_[arch][setup][ext]"
          args: ${{ matrix.args }}

      - name: Verify updater manifests
        shell: bash
        run: |
          echo "Checking for updater manifests..."
          MANIFEST="src-tauri/target/release/bundle/latest.json"
          if [ -f "$MANIFEST" ]; then
            echo "✅ Updater manifest found: latest.json"
            echo "   Platforms:"
            grep -oE '"(darwin|windows|linux)-[^"]*"' "$MANIFEST" | sort -u | while read -r p; do echo "     - $p"; done
          else
            echo "⚠️  WARNING: No updater manifest (latest.json) generated"
            echo "   Make sure TAURI_SIGNING_PRIVATE_KEY is set in GitHub Secrets."
            echo "   If key has password, TAURI_SIGNING_PRIVATE_KEY_PASSWORD must also be set."
            echo "   Generate keys with: npx @tauri-apps/cli signer generate -w ~/.tauri/myapp.key"
          fi

  # Flip the draft release public only after every matrix job has uploaded
  # its assets and the merged updater manifest.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job does not check out the repo. gh would otherwise try to
      # resolve the remote from .git and fail with "not a git repository"
      # (that is what left v0.24.2 stuck as a draft).
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false

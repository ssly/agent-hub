name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run version -- ${{ github.ref_name }}
      - run: npm run build:css

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Agent Hub ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          args: ${{ matrix.args }}

      - name: Verify updater manifests
        shell: bash
        run: |
          echo "Checking for updater manifests..."
          MANIFEST="src-tauri/target/release/bundle/latest.json"
          if [ -f "$MANIFEST" ]; then
            echo "✅ Updater manifest found: latest.json"
            echo "   Platforms:"
            grep -oE '"(darwin|windows|linux)-[^"]*"' "$MANIFEST" | sort -u | while read -r p; do echo "     - $p"; done
          else
            echo "⚠️  WARNING: No updater manifest (latest.json) generated"
            echo "   Make sure TAURI_SIGNING_PRIVATE_KEY is set in GitHub Secrets."
            echo "   If key has password, TAURI_SIGNING_PRIVATE_KEY_PASSWORD must also be set."
            echo "   Generate keys with: npx @tauri-apps/cli signer generate -w ~/.tauri/myapp.key"
          fi

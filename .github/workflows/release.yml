name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run version -- ${{ github.ref_name }}
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Test Windows background process behavior
        if: matrix.platform == 'windows-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml claude_plugin::tests

      - name: Read release notes from tag annotation
        shell: bash
        run: |
          git fetch --tags --force --quiet
          {
            echo "RELEASE_BODY<<__EOF__"
            git tag -l --format='%(contents)' "${{ github.ref_name }}"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Agent Hub ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          args: ${{ matrix.args }}

      # User-facing installers download as agent-hub_*; updater artifacts
      # (.app.tar.gz / .nsis.zip / .sig / latest.json) keep their original
      # names so the updater manifest stays valid (signatures cover content,
      # not names — but we don't touch those files at all).
      - name: Rename installer assets to agent-hub format
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            case "$asset" in
              "Agent Hub_"*.dmg | "Agent Hub_"*-setup.exe)
                renamed="agent-hub_${asset#Agent Hub_}"
                echo "Renaming: $asset → $renamed"
                gh release download "$TAG" --pattern "$asset" --clobber
                mv "$asset" "$renamed"
                gh release upload "$TAG" "$renamed"
                gh release delete-asset "$TAG" "$asset" --yes
                rm -f "$renamed"
                ;;
            esac
          done

      - name: Verify updater manifests
        shell: bash
        run: |
          echo "Checking for updater manifests..."
          MANIFEST="src-tauri/target/release/bundle/latest.json"
          if [ -f "$MANIFEST" ]; then
            echo "✅ Updater manifest found: latest.json"
            echo "   Platforms:"
            grep -oE '"(darwin|windows|linux)-[^"]*"' "$MANIFEST" | sort -u | while read -r p; do echo "     - $p"; done
          else
            echo "⚠️  WARNING: No updater manifest (latest.json) generated"
            echo "   Make sure TAURI_SIGNING_PRIVATE_KEY is set in GitHub Secrets."
            echo "   If key has password, TAURI_SIGNING_PRIVATE_KEY_PASSWORD must also be set."
            echo "   Generate keys with: npx @tauri-apps/cli signer generate -w ~/.tauri/myapp.key"
          fi

<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    (function() {
      const saved = localStorage.getItem('ah-theme');
      // Set the attribute explicitly both ways so other windows (tray popup)
      // can tell an explicit light choice apart from "never chosen".
      if (saved === 'night') document.documentElement.setAttribute('data-theme', 'night');
      else if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
</head>
<body class="h-full font-sans select-none">
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

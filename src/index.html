<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Hub</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="h-full bg-gray-900 text-gray-100 font-sans select-none">
    <div id="app" class="flex h-full">
        <!-- Sidebar -->
        <aside class="w-64 min-w-[16rem] bg-gray-800 border-r border-gray-700 flex flex-col">
            <div class="p-4 border-b border-gray-700 flex items-center justify-between">
                <h1 class="text-lg font-bold text-green-400">Agent Hub</h1>
                <div class="flex gap-2">
                    <button id="btn-lang" class="text-xs text-gray-400 hover:text-white cursor-pointer">EN</button>
                    <button id="btn-refresh" class="text-xs text-gray-400 hover:text-white cursor-pointer">Refresh</button>
                </div>
            </div>
            <div id="platform-list" class="flex-1 overflow-y-auto p-2 space-y-0.5"></div>
            <div class="p-3 border-t border-gray-700">
                <input id="search-input" type="text"
                    class="w-full bg-gray-700 text-sm text-gray-200 rounded px-3 py-1.5 placeholder-gray-500 outline-none focus:ring-1 focus:ring-cyan-500"
                    placeholder="Search skills..." />
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- Toolbar -->
            <div id="toolbar" class="flex items-center gap-2 px-4 py-2 bg-gray-800 border-b border-gray-700">
                <button id="btn-back" class="hidden text-sm text-gray-400 hover:text-white cursor-pointer">&larr; Back</button>
                <span id="breadcrumb" class="text-sm text-gray-400"></span>
                <div class="flex-1"></div>
                <button id="btn-diff" class="hidden px-3 py-1 text-xs bg-purple-700 hover:bg-purple-600 rounded cursor-pointer">Diff</button>
                <button id="btn-sync" class="hidden px-3 py-1 text-xs bg-cyan-700 hover:bg-cyan-600 rounded cursor-pointer">Sync</button>
            </div>

            <!-- Views -->
            <div id="view-skills" class="flex-1 overflow-y-auto p-4"></div>
            <div id="view-detail" class="flex-1 overflow-y-auto p-6 hidden"></div>
            <div id="view-diff" class="flex-1 overflow-y-auto p-6 hidden"></div>
            <div id="view-search" class="flex-1 overflow-y-auto p-4 hidden"></div>
        </main>
    </div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50" style="display:none;">
        <div id="modal-content" class="bg-gray-800 rounded-lg shadow-xl w-[28rem] max-h-[80vh] overflow-y-auto"></div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>

[package]
name = "agent-hub"
version = "0.23.1"
edition = "2021"
description = "A desktop hub for managing AI agent skills across platforms"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
similar = "2"
dirs = "6"
toml = "0.8"
walkdir = "2"
fs_extra = "1"
sys-locale = "0.3"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
base64 = "0.22"
futures-util = "0.3"
http = "1"
minisign-verify = "0.2"
# system-proxy: desktop GUI apps have no shell env (HTTP_PROXY etc.), so
# without this feature usage queries bypass the OS proxy and hang until
# timeout on networks that require one (notably grok.com / chatgpt.com in CN).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "system-proxy"] }
notify = { version = "7", features = ["macos_fsevent"] }
sysinfo = "0.34"
uuid = { version = "1", features = ["v4"] }

# macOS: background windows only receive hover (mouse-moved) events when the
# NSWindow opts in — and even then WKWebView hover stays unreliable while
# another app is focused, so the docked strip watches the cursor position
# itself (core-graphics). Version pinned to tao's lineage.
[target."cfg(target_os = \"macos\")".dependencies]
objc2-app-kit = "0.3"
core-graphics = "0.25"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
